
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate - TrustFund</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="donate.html">Donate</a>
</nav>

<h1>Make a Donation</h1>

<section class="mission">
    <h2>Support a Campaign</h2>

    <form id="donationForm">

        <label>Full Name</label>
        <input type="text" id="donorName"
               placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" id="donorEmail"
               placeholder="Enter your email" required>

        <label>Select Campaign</label>
        <select id="campaign" required>
    <option value="">Choose a campaign</option>
    <option>Flood Relief 2026</option>
    <option>Education for All</option>
    <option>Winter Clothing Drive</option>
</select>

        <label>Donation Amount (৳)</label>
        <input type="number" id="amount"
               placeholder="Enter amount" min="1" required>

        <button type="submit">Submit Donation</button>

    </form>
</section>

<script src="script.js"></script>
</body>
</html>
